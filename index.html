<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One for All</title>
<meta name="description" content="Pengingat jadwal harian untuk semua proyek, ditemani Ofa si kapibara.">
<meta name="theme-color" content="#FFF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OfA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
:root{--cream:#FFF6E9;--ink:#3B2A1E;--muted:#6E5A4A;--line:#EADBC6;--soft:#F3E6D3;--coral:#FF8A7A;--mint:#7FD8B5;--danger:#A8361F;--focus:#E0A82E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.main{padding:calc(20px + env(safe-area-inset-top)) 20px calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h1{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:32px;line-height:1.1;margin:2px 0 0}
h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:20px;margin:6px 0 -4px;display:flex;align-items:center;gap:8px}
.count{font-family:Nunito,sans-serif;font-size:13px;font-weight:800;background:var(--soft);border-radius:999px;padding:2px 9px}
.eyebrow{margin:0;font-size:14px;font-weight:700;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:999px;border:none;background:#fff;color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.small-btn{width:40px;height:40px;background:var(--cream)}
.week-nav{display:flex;gap:8px}
.card{background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card-title{margin:0;font-size:16px;font-weight:800}
.hero{flex-direction:row;gap:12px;align-items:center}
.hero .ofa{flex-shrink:0;line-height:0}
.hero-body{flex:1;min-width:0}
.bubble{margin:0;font-size:15px;line-height:1.45;font-weight:700}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:12px;flex:1}
.bar span{display:block;height:100%;background:var(--mint);border-radius:999px;transition:width .4s}
.bar.thin{margin:0;height:10px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-row .bar{margin-top:10px}
.pct{font-family:Fredoka,sans-serif;font-size:18px;font-weight:600;margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:13px;font-weight:600;margin:6px 0 0;line-height:1.45}
.center{text-align:center}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;margin:0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row-between .card-title{white-space:nowrap}
.grow{flex:1;min-width:0}
.quick{display:flex;gap:8px;background:#fff;border-radius:999px;padding:5px 5px 5px 18px;align-items:center;border:2px solid transparent}
.quick:focus-within{border-color:var(--focus)}
.quick input{flex:1;min-width:0;border:none;outline:none;font-size:15px;font-weight:600;background:transparent;height:44px}
.quick input::placeholder,.input::placeholder{color:#8A7666}
.send{width:44px;height:44px;border-radius:999px;border:none;background:var(--coral);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{min-height:40px;padding:0 16px;border-radius:999px;border:2px solid transparent;font-size:14px;font-weight:800;background:#fff}
.chipbtn.on{background:var(--ink);color:var(--cream)}
.chip{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{background:#fff;border-radius:20px;display:flex;flex-wrap:wrap;align-items:center;padding:4px 14px 4px 4px;column-gap:2px}
.check{width:44px;height:44px;border:none;background:none;display:grid;place-items:center;flex-shrink:0;padding:0}
.check span{width:26px;height:26px;border-radius:999px;border:2px solid #CDB89E;display:grid;place-items:center;color:#1F4D3B;transition:background .2s}
.is-done .check span{background:var(--mint);border-color:var(--mint)}
.task-main{flex:1;min-width:0;text-align:left;border:none;background:none;padding:8px 4px;display:flex;flex-direction:column;gap:6px}
.task-title{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.is-done .task-title{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--muted)}
.meta-ic{display:inline-flex}
.task-time{font-size:15px;font-weight:800;white-space:nowrap}
.row-actions{display:flex;gap:6px;width:100%;padding:0 0 8px 46px;flex-wrap:wrap}
.mini{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:13px;font-weight:800}
.mini.dark{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.empty-line{margin:0;background:#fff;border-radius:20px;padding:16px;font-weight:600;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;text-align:center}
.empty p{margin:0;font-weight:700}
.day-h{font-size:18px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.day{padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day.today{background:#FFF0C7}
.day small{font-size:11px;font-weight:800;color:var(--muted)}
.day b{font-size:15px}
.dots{display:flex;gap:2px;height:7px}
.dots i{width:7px;height:7px;border-radius:999px}
.pill-label{margin:-6px 0 0;font-size:13px;font-weight:800;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center}
.pname{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnum{font-size:13px;font-weight:800;text-align:right}
.stickers{flex-direction:row;align-items:center;gap:12px}
.stars{display:flex;gap:6px;flex-wrap:wrap;max-width:50%}
.stars span{width:36px;height:36px;border-radius:999px;display:grid;place-items:center}
.stars .star-next{border:2px dashed #CDB89E;color:#8A7666;font-weight:800}
.proj{gap:10px}
.proj-head{display:flex;align-items:center;gap:12px}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:18px;font-weight:600;color:var(--ink);flex-shrink:0}
.proj-foot{display:flex;align-items:center;gap:8px}
.rule{margin:0;flex:1;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:700}
.switch{width:52px;height:44px;border:none;background:none;padding:0;display:grid;place-items:center;flex-shrink:0}
.switch span{width:48px;height:28px;border-radius:999px;background:#E6D8C5;display:flex;padding:3px;transition:background .2s}
.switch span::after{content:"";width:22px;height:22px;border-radius:999px;background:#fff;transition:transform .2s}
.switch[aria-checked="true"] span{background:var(--mint)}
.switch[aria-checked="true"] span::after{transform:translateX(20px)}
.dashed{min-height:52px;border-radius:20px;border:2px dashed #CDB89E;background:transparent;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.settings{gap:6px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--soft);font-size:15px;font-weight:800}
.set-row:last-child{border-bottom:none}
.ofa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ofa-grid figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.ofa-grid figcaption{font-size:12px;font-weight:800;color:var(--muted)}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(108px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:999px;border:none;background:var(--coral);color:var(--ink);display:grid;place-items:center;z-index:5}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;border-radius:28px 28px 0 0;display:flex;justify-content:space-around;padding:10px 0 calc(14px + env(safe-area-inset-bottom));z-index:6}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:64px;padding:0}
.nav button span{padding:4px 16px;border-radius:999px;display:flex}
.nav button[aria-current="page"]{color:var(--ink);font-weight:800}
.nav button[aria-current="page"] span{background:#FFF0C7}
.overlay{position:fixed;inset:0;background:rgba(59,42,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--cream);width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-size:22px}
.sheet form{display:flex;flex-direction:column;gap:14px}
#f-normal,#f-lomba{display:flex;flex-direction:column;gap:14px}
#f-normal[hidden],#f-lomba[hidden]{display:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:800}
.input{height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:0 14px;font-size:15px;font-weight:600;width:100%;min-width:0}
.input.compact{width:150px;height:44px}
textarea.input{height:auto;min-height:72px;padding:12px 14px;resize:vertical}
.input:focus{outline:none;border-color:var(--focus)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lomba-toggle{display:flex;gap:10px;align-items:flex-start;background:#FFF0C7;color:#5E4000;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.4}
.lomba-toggle[hidden]{display:none}
.lomba-toggle input{width:20px;height:20px;margin:1px 0 0;accent-color:#7A5200;flex-shrink:0}
.tip{display:flex;gap:8px;align-items:center;background:#fff;border-radius:16px;padding:8px 12px 8px 6px}
.tip p{margin:0;font-size:13px;font-weight:700;line-height:1.45}
.form-err{margin:0;color:var(--danger);font-weight:800;font-size:14px}
.btn{min-height:52px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--cream);font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:0 20px;text-align:center;flex:1}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--danger);border-color:#F2C2B7}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.color input,.chipradio input{position:absolute;opacity:0;width:1px;height:1px}
.color span[aria-hidden]{display:block;width:40px;height:40px;border-radius:999px;border:3px solid #fff;outline:2px solid transparent}
.color input:checked+span{outline-color:var(--ink)}
.color input:focus-visible+span{outline-color:var(--focus)}
.chipradio span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:14px;font-weight:800;cursor:pointer}
.chipradio input:checked+span{background:#FFF0C7;border-color:#E0A82E;color:#5E4000}
.chipradio input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.summary-top{display:flex;flex-direction:column;align-items:center;gap:6px}
.summary-top p{margin:0}
.summary-hi{font-family:Fredoka,sans-serif;font-size:28px;font-weight:600;text-align:center}
.sum-card{flex-direction:row;align-items:flex-start;gap:12px;padding:14px 16px}
.sum-card .dot{width:14px;height:14px;border-radius:999px;margin-top:5px;flex-shrink:0}
.sum-card .small{margin-top:4px}
.tips{margin:0;padding-left:20px;font-weight:700;line-height:1.7}
.sync-row{display:flex;align-items:center;gap:12px}
.sync-dot{width:12px;height:12px;border-radius:999px;background:var(--mint);flex-shrink:0}
.sync-dot.warn{background:#FFC94D}
.warn-text{color:#7A5200;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom));background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:18px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;width:max-content;max-width:min(440px,calc(100% - 32px));z-index:30}
#toast[hidden]{display:none}
#toast button{background:none;border:none;color:#FFC94D;font-weight:800;min-height:40px;padding:0 4px;flex-shrink:0}
.toast-ofa{line-height:0;background:#FFF0C7;border-radius:999px;padding:2px 6px;flex-shrink:0}
.notes{list-style:none;margin:0;padding:0;column-count:2;column-gap:10px}
.note{break-inside:avoid;margin:0 0 10px;border-radius:18px;display:block}
.note-main{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;border:none;background:none;color:inherit;padding:14px;border-radius:18px}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:12;-webkit-box-orient:vertical;overflow:hidden}
.note-text b{font-weight:800}
.note-foot{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700}
.note-pin{display:inline-flex}
.note-search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:0 16px;color:var(--muted);border:2px solid transparent}
.note-search:focus-within{border-color:var(--focus)}
.note-search input{flex:1;min-width:0;border:none;outline:none;height:44px;font-size:15px;font-weight:600;background:transparent;color:var(--ink)}
.note-area{width:100%;min-height:260px;border:2px solid transparent;border-radius:20px;padding:16px;font-size:16px;font-weight:600;line-height:1.5;resize:vertical}
.note-area:focus{outline:none;border-color:var(--focus)}
.swatch{width:32px;height:32px;border-radius:999px;border:3px solid #fff;outline:2px solid transparent;padding:0}
.swatch[aria-pressed="true"]{outline-color:var(--ink)}
.nav button{min-width:56px}
.nav button span{padding:4px 12px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chipbtn{flex-shrink:0;white-space:nowrap}
.chat-main{padding-bottom:calc(240px + env(safe-area-inset-bottom))}
.top .mini{flex-shrink:0}
.chat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;max-width:85%}
.msg.aku{align-self:flex-end;align-items:flex-end}
.msg.aku .chat-text{background:var(--ink);color:var(--cream);border-radius:20px 20px 6px 20px;padding:10px 14px}
.msg.ofa{flex-direction:row;gap:8px;align-items:flex-end;max-width:100%}
.msg-ofa{flex-shrink:0;width:44px;height:44px;border-radius:999px;background:#FFF0C7;display:grid;place-items:center;overflow:hidden;line-height:0}
.msg-body{background:#fff;border-radius:20px 20px 20px 6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.chat-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;font-weight:600;line-height:1.45}
.msg-time{font-size:11px;font-weight:700;color:var(--muted);margin-top:4px}
.msg-body .msg-time{margin-top:-4px}
.msg-body .task{background:var(--cream)}
.chat-act{display:flex;gap:8px;flex-wrap:wrap}
.link-mini{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.chat-dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:100%;max-width:480px;padding:14px 20px 10px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(to bottom,rgba(255,246,233,0),var(--cream) 16px);z-index:5}
.chat-dock .quick{box-shadow:0 2px 10px rgba(59,42,30,.08)}
@media (min-width:900px){#app.wide{max-width:980px}#app.wide .notes{column-count:3}}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><p style="padding:40px 20px;font-weight:700">Memuat One for All…</p></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:20px">One for All butuh JavaScript yang menyala.</p></noscript>
<script src="core.js"></script>
<script src="app.js"></script>
<script src="dilan.js?v=5" data-aplikasi="ofa" defer></script>
<script type="module" src="sync.js"></script>
</body>
</html>
